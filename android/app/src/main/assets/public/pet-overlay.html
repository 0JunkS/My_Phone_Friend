<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Phone Friend Overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      background-color: transparent !important;
      touch-action: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    #global-character-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      pointer-events: none;
      z-index: 1;
      overflow: visible !important;
    }

    /* =========================================================
       CHARACTER BASE STYLES
       ========================================================= */
    .character-container {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 110px;
      height: 120px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none !important;
      cursor: grab;
      z-index: 999999;
      pointer-events: auto !important;
      will-change: transform;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      overflow: visible !important;
    }
    .character-container:active {
      cursor: grabbing;
    }
    .character-body-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: 50% 80%;
      pointer-events: none !important;
      overflow: visible !important;
    }
    .character-body-wrapper * {
      pointer-events: none !important;
    }
    .character-body-wrapper svg {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* =========================================================
       SPEECH BUBBLE
       ========================================================= */
    .character-speech-bubble {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.96);
      color: #1e293b;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 14px;
      white-space: nowrap;
      max-width: 180px;
      text-overflow: ellipsis;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
      margin-bottom: 4px;
    }
    .character-speech-bubble.active {
      opacity: 1;
    }
    .character-speech-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(255,255,255,0.96);
    }

    /* =========================================================
       MIC LISTENING INDICATOR
       ========================================================= */
    .mic-indicator {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: rgba(239, 68, 68, 0.92);
      color: white;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 24px;
      z-index: 99999;
      box-shadow: 0 4px 20px rgba(239,68,68,0.5);
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
      opacity: 0;
      white-space: nowrap;
    }
    .mic-indicator.active {
      transform: translateX(-50%) scale(1);
      opacity: 1;
      animation: micPulse 1.2s infinite ease-in-out;
    }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(239,68,68,0.5); }
      50%       { box-shadow: 0 4px 32px rgba(239,68,68,0.9), 0 0 0 8px rgba(239,68,68,0.15); }
    }

    /* Triple-tap hint ring */
    .triple-tap-hint {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.35);
      padding: 4px 12px;
      border-radius: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 9999;
    }
    .triple-tap-hint.show { opacity: 1; }

    /* =========================================================
       WALKING ANIMATION
       ========================================================= */
    @keyframes nanoWalkBob {
      0%   { transform: scaleX(var(--char-facing, 1)) translateY(0px) rotate(-2deg); }
      50%  { transform: scaleX(var(--char-facing, 1)) translateY(-7px) rotate(0deg); }
      100% { transform: scaleX(var(--char-facing, 1)) translateY(0px) rotate(2deg); }
    }
    @keyframes nanoStepLeft {
      0%   { transform: translateY(0px) rotate(15deg); }
      100% { transform: translateY(-4px) rotate(-15deg); }
    }
    @keyframes nanoStepRight {
      0%   { transform: translateY(-4px) rotate(-15deg); }
      100% { transform: translateY(0px) rotate(15deg); }
    }
    @keyframes nanoArmSwingLeft {
      0%   { transform: rotate(-15deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes nanoArmSwingRight {
      0%   { transform: rotate(20deg); }
      100% { transform: rotate(-15deg); }
    }
    .character-container[data-state="walk"] .character-body-wrapper {
      animation: nanoWalkBob 0.6s infinite alternate cubic-bezier(0.45,0.05,0.55,0.95);
    }
    .character-container[data-state="walk"] .nano-leg-left  { animation: nanoStepLeft 0.6s infinite alternate ease-in-out; }
    .character-container[data-state="walk"] .nano-leg-right { animation: nanoStepRight 0.6s infinite alternate ease-in-out; }
    .character-container[data-state="walk"] .nano-arm-left  { animation: nanoArmSwingLeft 0.6s infinite alternate ease-in-out; }
    .character-container[data-state="walk"] .nano-arm-right { animation: nanoArmSwingRight 0.6s infinite alternate ease-in-out; }

    /* =========================================================
       LIFTED / DRAGGED ANIMATIONS
       ========================================================= */
    @keyframes nanoLiftedFlail {
      0%   { transform: scaleX(var(--char-facing, 1)) scale(1.1) rotate(-5deg) translateY(-2px); }
      100% { transform: scaleX(var(--char-facing, 1)) scale(1.1) rotate(5deg) translateY(2px); }
    }
    @keyframes nanoLegFlailLeft  { 0% { transform: rotate(35deg) scaleY(0.85); }  100% { transform: rotate(-30deg) scaleY(1.15); } }
    @keyframes nanoLegFlailRight { 0% { transform: rotate(-30deg) scaleY(1.15); } 100% { transform: rotate(35deg) scaleY(0.85); } }
    @keyframes nanoArmFlailLeft  { 0% { transform: rotate(-60deg); } 100% { transform: rotate(40deg); } }
    @keyframes nanoArmFlailRight { 0% { transform: rotate(60deg);  } 100% { transform: rotate(-40deg); } }
    .character-container[data-state="lifted"] {
      filter: drop-shadow(0 18px 24px rgba(0,0,0,0.45)) brightness(1.08);
      z-index: 10000;
    }
    .character-container[data-state="lifted"] .character-body-wrapper { animation: nanoLiftedFlail 0.22s infinite alternate ease-in-out; }
    .character-container[data-state="lifted"] .nano-leg-left  { animation: nanoLegFlailLeft  0.18s infinite alternate ease-in-out; }
    .character-container[data-state="lifted"] .nano-leg-right { animation: nanoLegFlailRight 0.18s infinite alternate ease-in-out 0.09s; }
    .character-container[data-state="lifted"] .nano-arm-left  { animation: nanoArmFlailLeft  0.2s infinite alternate ease-in-out; }
    .character-container[data-state="lifted"] .nano-arm-right { animation: nanoArmFlailRight 0.2s infinite alternate ease-in-out 0.1s; }

    /* =========================================================
       HAPPY ANIMATIONS
       ========================================================= */
    @keyframes nanoHappyJump {
      0%, 100% { transform: scaleX(var(--char-facing, 1)) translateY(0) scale(1.05, 0.92); }
      45%       { transform: scaleX(var(--char-facing, 1)) translateY(-22px) scale(0.95, 1.08) rotate(6deg); }
      70%       { transform: scaleX(var(--char-facing, 1)) translateY(-14px) scale(1, 1.02) rotate(-6deg); }
    }
    @keyframes nanoHappyWaveLeft  { 0% { transform: rotate(-50deg); } 100% { transform: rotate(10deg); } }
    @keyframes nanoHappyWaveRight { 0% { transform: rotate(50deg);  } 100% { transform: rotate(-10deg); } }
    .character-container[data-state="happy"] .character-body-wrapper { animation: nanoHappyJump 0.55s infinite cubic-bezier(0.28,0.84,0.42,1); }
    .character-container[data-state="happy"] .nano-arm-left  { animation: nanoHappyWaveLeft  0.28s infinite alternate ease-in-out; }
    .character-container[data-state="happy"] .nano-arm-right { animation: nanoHappyWaveRight 0.28s infinite alternate ease-in-out; }

    /* =========================================================
       SAD ANIMATIONS
       ========================================================= */
    @keyframes nanoSadSigh {
      0%, 100% { transform: scaleX(var(--char-facing, 1)) translateY(4px) scale(0.96, 0.94); }
      50%       { transform: scaleX(var(--char-facing, 1)) translateY(8px) scale(0.93, 0.90) rotate(-2deg); }
    }
    @keyframes nanoSadWalk {
      0%   { transform: rotate(6deg) translateY(2px); }
      100% { transform: rotate(-6deg) translateY(2px); }
    }
    .character-container[data-state="sad"] .character-body-wrapper {
      animation: nanoSadSigh 1.8s infinite ease-in-out;
      filter: saturate(0.8) hue-rotate(-15deg);
    }
    .character-container[data-state="sad"] .nano-leg-left,
    .character-container[data-state="sad"] .nano-leg-right { animation: nanoSadWalk 1.4s infinite alternate ease-in-out; }

    /* Long press ring */
    .long-press-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      border: 3px solid rgba(250,204,21,0.85);
      box-shadow: 0 0 12px rgba(250,204,21,0.5);
      opacity: 0;
      transition: transform 0.4s ease-out, opacity 0.3s ease;
      pointer-events: none;
      z-index: 2;
    }
    .long-press-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
  <script type="module" crossorigin src="./assets/overlay-B-cODhM2.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/customizer-D41sh6Qg.js">
</head>
<body class="mode-overlay">
  <div id="global-character-layer"></div>
  <div class="mic-indicator" id="mic-indicator">🎙️ 듣는 중...</div>
  <div class="triple-tap-hint" id="triple-tap-hint">세 번 탭하면 마이크가 켜져요</div>
</body>
</html>
