kind = "web"
previewPath = "/"
title = "내 폰 안의 친구"
description = "Android 화면 위에서 함께 움직이는 플로팅 펫과 AI 동반자 앱입니다. 백그라운드 포그라운드 서비스와 오버레이 권한을 사용해 다른 앱을 보고 있을 때도 펫이 유지됩니다."
version = "1.0.0"
id = "artifacts/my-phone-friend"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26076

[services.development]
run = "pnpm --filter @workspace/my-phone-friend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/my-phone-friend", "run", "build" ]
serve = "static"
publicDir = "artifacts/my-phone-friend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26076"
BASE_PATH = "/"
