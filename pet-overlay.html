<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Phone Friend Overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      background-color: transparent !important;
      touch-action: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    #global-character-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      pointer-events: none;
      z-index: 1;
      overflow: visible !important;
    }

    /* =========================================================
       CHARACTER BASE STYLES
       ========================================================= */
    .character-container {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 110px;
      height: 120px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none !important;
      cursor: grab;
      z-index: 999999;
      pointer-events: auto !important;
      will-change: transform;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      overflow: visible !important;
    }
    .character-container:active {
      cursor: grabbing;
    }
    .character-body-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: 50% 80%;
      pointer-events: none !important;
      overflow: visible !important;
    }
    .character-body-wrapper * {
      pointer-events: none !important;
    }
    .character-body-wrapper svg {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* =========================================================
       SPEECH BUBBLE
       ========================================================= */
    .character-speech-bubble {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.96);
      color: #1e293b;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 14px;
      white-space: nowrap;
      max-width: 180px;
      text-overflow: ellipsis;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
      margin-bottom: 4px;
    }
    .character-speech-bubble.active {
      opacity: 1;
    }
    .character-speech-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(255,255,255,0.96);
    }

    /* =========================================================
       WALKING ANIMATION
       ========================================================= */
    @keyframes nanoWalkBob {
      0%   { transform: scaleX(var(--char-facing, 1)) translateY(0px); }
      100% { transform: scaleX(var(--char-facing, 1)) translateY(-4px); }
    }
    @keyframes nanoLegSwingLeft {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(20deg); }
    }
    @keyframes nanoLegSwingRight {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(-20deg); }
    }
    .character-container[data-state="walk"] .character-body-wrapper {
      animation: nanoWalkBob 0.6s infinite alternate cubic-bezier(0.45,0.05,0.55,0.95);
    }
    .character-container[data-state="walk"] .nano-leg-left {
      animation: nanoLegSwingLeft 0.6s infinite alternate;
    }
    .character-container[data-state="walk"] .nano-leg-right {
      animation: nanoLegSwingRight 0.6s infinite alternate;
    }

    @keyframes nanoLiftedBounce {
      0%, 100% { transform: scaleX(var(--char-facing, 1)) translateY(0px) rotate(-3deg); }
      50%       { transform: scaleX(var(--char-facing, 1)) translateY(-6px) rotate(3deg); }
    }
    .character-container[data-state="lifted"] .character-body-wrapper {
      animation: nanoLiftedBounce 0.4s infinite alternate;
    }

    @keyframes nanoHappyBounce {
      0%, 100% { transform: scaleX(var(--char-facing, 1)) translateY(0px) scale(1); }
      50%       { transform: scaleX(var(--char-facing, 1)) translateY(-8px) scale(1.05); }
    }
    .character-container[data-state="happy"] .character-body-wrapper {
      animation: nanoHappyBounce 0.5s infinite alternate cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes nanoSadDroop {
      0%, 100% { transform: scaleX(var(--char-facing, 1)) translateY(0px); }
      50%       { transform: scaleX(var(--char-facing, 1)) translateY(2px); }
    }
    .character-container[data-state="sad"] .character-body-wrapper {
      animation: nanoSadDroop 1.2s infinite alternate;
    }

    /* Long press ring */
    .long-press-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      border: 3px solid rgba(250,204,21,0.85);
      box-shadow: 0 0 12px rgba(250,204,21,0.5);
      opacity: 0;
      transition: transform 0.4s ease-out, opacity 0.3s ease;
      pointer-events: none;
      z-index: 2;
    }
    .long-press-ring.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body class="mode-overlay">
  <div id="global-character-layer"></div>
  <script type="module" src="./src/js/overlay-entry.js"></script>
</body>
</html>
