name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Complete Capacitor Android Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Generating complete Android project structure..."
            if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              mkdir -p /tmp/android_backup
              cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/AndroidManifest.xml
            fi
            rm -rf android
            npx cap add android
            if [ -f "/tmp/android_backup/AndroidManifest.xml" ]; then
              cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            fi
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release AAB (App Bundle)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-phone-friend-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-phone-friend-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
